[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "midi-bot-9000"
version = "0.2.0"
description = "A small PyTorch Transformer for monophonic jazz MIDI continuation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<3",
  "miditok>=3.0.6,<4",
  "huggingface-hub>=1,<2",
  "symusic>=0.5.5,<0.6",
  "pretty-midi>=0.2.10,<0.3",
  "mido>=1.3,<2",
  "numpy>=1.26,<3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
jazzbot = "jazzbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jazzbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
