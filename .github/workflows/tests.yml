name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked --extra dev ruff check src tests scripts
      - run: uv run --locked --extra dev pytest -q
      - run: uv run --locked jazzbot --help
      - run: uv run --locked jazzbot info
